<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco The Grinch</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f0c; color: #fff; padding-bottom: 90px; }
        header { text-align: center; padding: 20px; background: #000; border-bottom: 2px solid #00ff41; }
        h1 { color: #00ff41; font-size: 2rem; text-shadow: 0 0 10px rgba(0,255,65,0.5); }
        .subtitle { color: #888; font-size: 0.9rem; margin-top: 5px; }

        /* Pantallas */
        .screen { display: none; padding: 15px; }
        .screen.active { display: block; }

        /* Menú Principal */
        .hero-banner { background: linear-gradient(135deg, #112d17, #051408); border: 2px solid #00ff41; border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .hero-banner h2 { color: #ff5722; font-size: 1.5rem; margin-bottom: 5px; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .menu-card { background: #121c14; border: 2px solid #00ff41; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
        .menu-card:active { transform: scale(0.95); background: #1a2f1e; }
        .menu-card h3 { color: #fff; font-size: 1.1rem; margin-bottom: 5px; }
        .menu-card p { color: #aaa; font-size: 0.8rem; }

        .btn-action { display: block; width: 100%; padding: 12px; border-radius: 12px; text-align: center; font-weight: bold; text-decoration: none; font-size: 1rem; margin-bottom: 12px; border: none; cursor: pointer; }
        .btn-wsp { background: #00ff41; color: #000; }
        .btn-map { background: #121c14; color: #00ff41; border: 2px solid #00ff41; }

        /* Categorías / Productos */
        .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-back { background: #222; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        
        .product-card { background: #121c14; border: 1px solid #1f3824; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .product-info h4 { font-size: 0.95rem; margin-bottom: 4px; color: #fff; }
        .product-info .price { color: #00ff41; font-weight: bold; font-size: 0.95rem; }
        
        .controls { display: flex; align-items: center; gap: 10px; }
        .controls button { background: #00ff41; color: #000; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .controls span { font-size: 1rem; font-weight: bold; width: 20px; text-align: center; }

        /* Carrito Flotante */
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #0b1a0e; border-top: 2px solid #00ff41; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.8); }
        .cart-info { font-size: 1.1rem; font-weight: bold; color: #00ff41; }
        .btn-checkout { background: #00ff41; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Kiosco The Grinch</h1>
        <p class="subtitle">Tu kiosco de confianza</p>
    </header>

    <!-- PANTALLA PRINCIPAL (HOME) -->
    <div id="home-screen" class="screen active">
        <div class="hero-banner">
            <h2>OFERTAS DEL DÍA</h2>
            <p>¡No te las pierdas! Consultá los mejores precios.</p>
        </div>

        <div class="menu-grid">
            <div class="menu-card" onclick="showCategory('almacen')">
                <h3>🛒 Almacén</h3>
                <p>Harinas, fideos, arroz y más</p>
            </div>
            <div class="menu-card" onclick="showCategory('bebidas')">
                <h3>🥤 Bebidas</h3>
                <p>Gaseosas, jugos y aguas</p>
            </div>
            <div class="menu-card" onclick="showCategory('congelados')">
                <h3>❄️ Congelados</h3>
                <p>Patitas, medallones y chipá</p>
            </div>
            <div class="menu-card" onclick="showCategory('panificados')">
                <h3>🍞 Panificados</h3>
                <p>Pan lactal, viena y prepizzas</p>
            </div>
        </div>

        <button class="btn-action btn-wsp" onclick="enviarPedidoDirecto()">💬 HACER PEDIDO (Escribinos por WhatsApp)</button>
        <button class="btn-action btn-map" onclick="alert('Ubicación: Av. Principal / Abierto todos los días.')">📍 CÓMO LLEGAR (Ver ubicación)</button>
    </div>

    <!-- PANTALLA DE CATEGORÍAS -->
    <div id="category-screen" class="screen">
        <div class="category-header">
            <button class="btn-back" onclick="showHome()">⬅ Volver</button>
            <h2 id="cat-title" style="color: #00ff41; font-size: 1.2rem;"></h2>
        </div>
        <div id="product-list"></div>
    </div>

    <!-- BARRA DE CARRITO FLOTANTE -->
    <div class="cart-bar" id="cart-bar" style="display: none;">
        <div class="cart-info" id="cart-total-text">Total: $0</div>
        <button class="btn-checkout" onclick="enviarPedidoWhatsApp()">Enviar Pedido 🛍️</button>
    </div>

    <script>
        // BASE DE DATOS DE PRODUCTOS CON PRECIOS NUMÉRICOS
        const products = {
            almacen: [
                { id: 1, name: "Fideos Luquetti 500g", price: 1600 },
                { id: 2, name: "Fideos Favorita Coditos 500g", price: 1000 },
                { id: 3, name: "Fideos La Providencia 500g", price: 1200 },
                { id: 4, name: "Arroz Dos Hermanos 1kg", price: 1600 },
                { id: 5, name: "Arroz Cañuela 0.5kg", price: 800 },
                { id: 6, name: "Atún Desmenuzado 170g", price: 2000 },
                { id: 7, name: "Polenta Presto Pronta Sabor Panceta", price: 1800 },
                { id: 8, name: "Polenta Presto Pronta Clásica 490g", price: 2000 },
                { id: 9, name: "Choclo Cremoso Inca 350g", price: 1500 },
                { id: 10, name: "Choclo Noel 300g", price: 1800 },
                { id: 11, name: "Puré de Tomates Baggio 530g", price: 1200 },
                { id: 12, name: "Puré de Tomates Santa Isabel 520g", price: 1000 },
                { id: 13, name: "Puré de Tomates Big C 210g", price: 500 },
                { id: 14, name: "Doña Pupa Remolacha en Cubos 340g", price: 2600 },
                { id: 15, name: "Doña Pupa Jardinera 340g", price: 700 },
                { id: 16, name: "Doña Pupa Zanahoria en Cubos 340g", price: 1100 },
                { id: 17, name: "Doña Pupa Lentejas 340g", price: 1600 },
                { id: 18, name: "Olivas Verdes Castell 200g", price: 1400 },
                { id: 19, name: "Vinagre de Alcohol San Iginio 1L", price: 1700 },
                { id: 20, name: "Vinagre de Alcohol Halconero 930ml", price: 1500 },
                { id: 21, name: "Flow Cereal Almohaditas Frutilla 180g", price: 2000 },
                { id: 22, name: "Bizcochos 9 de Oro 200g", price: 1600 }
            ],
            bebidas: [
                { id: 23, name: "Coca Cola 1.5L Retornable", price: 2800 },
                { id: 24, name: "Coca Cola 2.25L Descartable", price: 4000 },
                { id: 25, name: "Fernet Branca 750ml", price: 9500 },
                { id: 26, name: "Cerveza Heineken Lata 473ml", price: 2200 }
            ],
            congelados: [
                { id: 27, name: "Medallones Clásicos de Pollo", price: 2500 },
                { id: 28, name: "Patitas Crunch de Pollo", price: 2800 },
                { id: 29, name: "Chipá (Paquete 1/2 kg)", price: 3000 }
            ],
            panificados: [
                { id: 30, name: "Pan Viena / Panchos Plus Ultra", price: 1500 },
                { id: 31, name: "Pan para Hamburguesas Plus Ultra", price: 1500 },
                { id: 32, name: "Pan Lactal Plus Ultra 400g", price: 2400 },
                { id: 33, name: "Prepizza (x 1 unidad)", price: 1400 },
                { id: 34, name: "Prepizza (x 2 unidades)", price: 2200 }
            ]
        };

        let cart = {};

        function showCategory(catKey) {
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('category-screen').classList.add('active');
            
            const titles = { almacen: 'Almacén y Harinas', bebidas: 'Bebidas', congelados: 'Congelados', panificados: 'Panificados' };
            document.getElementById('cat-title').innerText = titles[catKey];

            let html = '';
            products[catKey].forEach(prod => {
                let qty = cart[prod.id] ? cart[prod.id].qty : 0;
                html += `
                    <div class="product-card">
                        <div class="product-info">
                            <h4>${prod.name}</h4>
                            <div class="price">$${prod.price.toLocaleString()}</div>
                        </div>
                        <div class="controls">
                            <button onclick="changeQty(${prod.id}, -1, '${catKey}')">-</button>
                            <span id="qty-${prod.id}">${qty}</span>
                            <button onclick="changeQty(${prod.id}, 1, '${catKey}')">+</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('product-list').innerHTML = html;
        }

        function showHome() {
            document.getElementById('category-screen').classList.remove('active');
            document.getElementById('home-screen').classList.add('active');
            updateCartBar();
        }

        function changeQty(id, change, catKey) {
            let prod = products[catKey].find(p => p.id === id);
            if (!cart[id]) {
                cart[id] = { name: prod.name, price: prod.price, qty: 0 };
            }
            cart[id].qty += change;
            if (cart[id].qty < 0) cart[id].qty = 0;
            
            document.getElementById(`qty-${id}`).innerText = cart[id].qty;

            if (cart[id].qty === 0) {
                delete cart[id];
            }
            updateCartBar();
        }

        function updateCartBar() {
            let totalItems = 0;
            let totalPrice = 0;
            for (let id in cart) {
                totalItems += cart[id].qty;
                totalPrice += cart[id].qty * cart[id].price;
            }

            const bar = document.getElementById('cart-bar');
            if (totalItems > 0) {
                bar.style.display = 'flex';
                document.getElementById('cart-total-text').innerText = `Total: $${totalPrice.toLocaleString()}`;
            } else {
                bar.style.display = 'none';
            }
        }

        function enviarPedidoWhatsApp() {
            let mensaje = "Hola! Quiero hacer el siguiente pedido en Kiosco The Grinch:%0A";
            let total = 0;
            for (let id in cart) {
                let subtotal = cart[id].qty * cart[id].price;
                total += subtotal;
                mensaje += `- ${cart[id].qty}x ${cart[id].name} ($${subtotal.toLocaleString()})%0A`;
            }
            mensaje += `%0A*Total a Pagar: $${total.toLocaleString()}*`;
            
            let numeroWhatsApp = "5493794000000"; // Reemplazá con tu número de WhatsApp
            window.open(`https://wa.me/${numeroWhatsApp}?text=${mensaje}`, '_blank');
        }

        function enviarPedidoDirecto() {
            let mensaje = "Hola! Quisiera hacer un pedido en Kiosco The Grinch.";
            let numeroWhatsApp = "5493794000000"; // Reemplazá con tu número de WhatsApp
            window.open(`https://wa.me/${numeroWhatsApp}?text=${mensaje}`, '_blank');
        }
    </script>
</body>
</html>
