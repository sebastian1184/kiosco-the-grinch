<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco The Grinch - Catálogo General y Pedidos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1a1a1a;
            --neon-green: #00ff66;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --border-color: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            padding-bottom: 80px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 15px;
            background-color: var(--bg-card);
            border-bottom: 2px solid var(--neon-green);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            color: var(--neon-green);
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-top: 4px;
        }

        .container {
            padding: 15px;
        }

        /* Categorías principales */
        .categorias {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .categoria-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .categoria-card:hover {
            border-color: var(--neon-green);
        }

        .categoria-card h3 {
            font-size: 1.1rem;
            color: var(--text-white);
        }

        .categoria-card i {
            color: var(--neon-green);
            font-size: 1.2rem;
        }

        /* Botonera inferior fija para pedidos */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 480px;
            margin: 0 auto;
        }

        .btn-whatsapp {
            background-color: var(--neon-green);
            color: var(--bg-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>KIOSCO THE GRINCH</h1>
        <p><i class="fa-solid fa-location-dot"></i> Av. Belgrano 963 | Tu kiosco de confianza</p>
    </header>

    <div class="container">
        <div class="categorias">
            <div class="categoria-card">
                <h3>🥤 Bebidas (Gaseosas, Cervezas, Fernet)</h3>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div class="categoria-card">
                <h3>🍕 Comidas (Pizzas, Empanadas, Patys)</h3>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div class="categoria-card">
                <h3>🍫 Kiosco & Dulces (Golosinas, Snacks)</h3>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div class="categoria-card">
                <h3>✨ Novedades & Otros (Limpieza, Varios)</h3>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>
    </div>

    <div class="footer-nav">
        <span>🛒 Carrito: <strong>0 ítems</strong></span>
        <a href="https://wa.me/" class="btn-whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> Hacer Pedido
        </a>
    </div>

</body>
</html>
